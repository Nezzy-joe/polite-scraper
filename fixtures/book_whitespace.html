<!DOCTYPE html>
<!-- A trimmed-down book page: messy whitespace, a normal description. -->
<html lang="en">
<body>
  <div class="col-sm-6 product_main">
    <h1>   The   Messy   Whitespace   Book   </h1>
    <p class="price_color">£12.34</p>
    <p class="instock availability">
        <i class="icon-ok"></i>

        In stock (5 available)

    </p>
    <p class="star-rating Four">
      <i class="icon-star"></i>
    </p>
  </div>
  <div id="product_description" class="sub-header">
    <h2>Product Description</h2>
  </div>
  <p>   A description with   irregular    spacing   that should be collapsed.   </p>
</body>
</html>
